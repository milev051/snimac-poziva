# Svaki push na main pravi novo izdanje sa APK-om; aplikacija na telefonu
# ga sama nađe i instalira. Broj verzije je redni broj ovog workflow-a.
name: Izdanje

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/izdanje.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: izdanje
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ključ za potpis
        env:
          POTPIS_BASE64: ${{ secrets.POTPIS_BASE64 }}
        run: |
          test -n "$POTPIS_BASE64" || { echo "Nedostaje tajna POTPIS_BASE64"; exit 1; }
          echo "$POTPIS_BASE64" | base64 -d > "$RUNNER_TEMP/potpis.jks"

      - name: Testovi i APK
        working-directory: android
        env:
          POTPIS_FAJL: ${{ runner.temp }}/potpis.jks
          POTPIS_LOZINKA: ${{ secrets.POTPIS_LOZINKA }}
        run: |
          VERZIJA="1.${{ github.run_number }}"
          echo "VERZIJA=$VERZIJA" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease \
            -PverzijaKod=${{ github.run_number }} -PverzijaIme=$VERZIJA
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/pozivi-$VERZIJA.apk"
          # Bez ovoga bi APK potpisan debug ključem pokvario ažuriranje na telefonu.
          ALATI=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$ALATI/apksigner" verify --print-certs "$RUNNER_TEMP/pozivi-$VERZIJA.apk" | grep -q "CN=Pozivi"

      - name: Objavi izdanje
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > "$RUNNER_TEMP/beleske.txt"
          gh release create "v$VERZIJA" "$RUNNER_TEMP/pozivi-$VERZIJA.apk" \
            --title "Pozivi $VERZIJA" --notes-file "$RUNNER_TEMP/beleske.txt" --target "$GITHUB_SHA"
